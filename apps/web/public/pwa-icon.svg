<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep midnight-to-navy background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e1a"/>
      <stop offset="100%" stop-color="#12183a"/>
    </linearGradient>
    <!-- Warm gold for the temple -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#c8922a"/>
    </linearGradient>
    <!-- Subtle glow behind temple -->
    <radialGradient id="glowGrad" cx="50%" cy="55%" r="38%">
      <stop offset="0%" stop-color="#f5c842" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f5c842" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Subtle warm glow behind temple -->
  <ellipse cx="256" cy="290" rx="180" ry="120" fill="url(#glowGrad)"/>

  <!-- Stars scattered in sky -->
  <circle cx="80"  cy="70"  r="1.8" fill="#f5c842" opacity="0.6"/>
  <circle cx="140" cy="45"  r="1.2" fill="#fff"    opacity="0.4"/>
  <circle cx="200" cy="80"  r="1.5" fill="#f5c842" opacity="0.5"/>
  <circle cx="310" cy="55"  r="1.8" fill="#fff"    opacity="0.45"/>
  <circle cx="370" cy="75"  r="1.2" fill="#f5c842" opacity="0.55"/>
  <circle cx="430" cy="48"  r="1.5" fill="#fff"    opacity="0.4"/>
  <circle cx="460" cy="90"  r="1.2" fill="#f5c842" opacity="0.5"/>
  <circle cx="100" cy="110" r="1.0" fill="#fff"    opacity="0.3"/>
  <circle cx="420" cy="120" r="1.0" fill="#fff"    opacity="0.3"/>
  <circle cx="255" cy="38"  r="2.2" fill="#fff"    opacity="0.5"/>

  <!-- Temple group — centered, scaled to fit nicely -->
  <g transform="translate(72, 100)">

    <!-- Pediment (triangular roof) -->
    <polygon points="184,0 0,72 368,72" fill="url(#goldGrad)"/>

    <!-- Tympanum detail line inside pediment -->
    <polygon points="184,14 18,72 350,72" fill="none" stroke="#f5c842" stroke-width="1.5" opacity="0.3"/>

    <!-- Architrave (top beam) -->
    <rect x="0" y="78" width="368" height="26" rx="4" fill="url(#goldGrad)"/>

    <!-- Frieze (decorative band) -->
    <rect x="0" y="110" width="368" height="14" rx="3" fill="#c8922a" opacity="0.7"/>

    <!-- Six columns -->
    <rect x="10"  y="130" width="36" height="168" rx="6" fill="url(#goldGrad)"/>
    <rect x="66"  y="130" width="36" height="168" rx="6" fill="url(#goldGrad)"/>
    <rect x="122" y="130" width="36" height="168" rx="6" fill="url(#goldGrad)"/>
    <rect x="178" y="130" width="36" height="168" rx="6" fill="url(#goldGrad)"/>
    <rect x="234" y="130" width="36" height="168" rx="6" fill="url(#goldGrad)"/>
    <rect x="290" y="130" width="36" height="168" rx="6" fill="url(#goldGrad)"/>
    <!-- Partial 7th column -->
    <rect x="322" y="130" width="36" height="168" rx="6" fill="url(#goldGrad)"/>

    <!-- Column capitals (top detail) -->
    <rect x="6"   y="126" width="44" height="8" rx="3" fill="#f5c842"/>
    <rect x="62"  y="126" width="44" height="8" rx="3" fill="#f5c842"/>
    <rect x="118" y="126" width="44" height="8" rx="3" fill="#f5c842"/>
    <rect x="174" y="126" width="44" height="8" rx="3" fill="#f5c842"/>
    <rect x="230" y="126" width="44" height="8" rx="3" fill="#f5c842"/>
    <rect x="286" y="126" width="44" height="8" rx="3" fill="#f5c842"/>
    <rect x="318" y="126" width="44" height="8" rx="3" fill="#f5c842"/>

    <!-- Stylobate (base steps) -->
    <rect x="-8"  y="298" width="384" height="16" rx="4" fill="url(#goldGrad)"/>
    <rect x="-18" y="316" width="404" height="14" rx="4" fill="#c8922a" opacity="0.85"/>
    <rect x="-28" y="332" width="424" height="12" rx="4" fill="#a07020" opacity="0.7"/>

  </g>

  <!-- "agora" wordmark below temple -->
  <text
    x="256"
    y="468"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="42"
    font-weight="700"
    letter-spacing="6"
    fill="url(#goldGrad)"
    opacity="0.92"
  >agora</text>

  <!-- Thin gold border around the whole icon -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#f5c842" stroke-width="2" opacity="0.18"/>
</svg>
